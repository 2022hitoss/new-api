name: Publish Docker image (Multi-arch)

on:
  push:
    branches:
      - main
  # 手动触发时在 "Use workflow from" 下拉里选分支即可，无需填写 tag
  workflow_dispatch:

# 同一个 ref 的构建不要并发；分支上的旧构建被新提交取代时直接取消
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  prepare:
    name: Resolve image tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      version: ${{ steps.resolve.outputs.version }}
      tags: ${{ steps.resolve.outputs.tags }}

    steps:
      # 统一在这里算一次版本号，避免两个架构分别取时间戳而落在不同日期上
      - name: Resolve image name and tags
        id: resolve
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/new-api"

          SLUG="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"
          SLUG="${SLUG:0:105}"
          SLUG="$(printf '%s' "$SLUG" | sed -E 's/[.-]+$//')"
          if [ -z "$SLUG" ]; then
            echo "::error::Ref '${REF_NAME}' cannot be converted to a valid Docker tag"
            exit 1
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            # tag 本身已经唯一，直接用
            VERSION="$SLUG"
            TAGS="$SLUG"
          else
            VERSION="${SLUG}-$(date -u +'%Y%m%d')-${GITHUB_SHA:0:7}"
            # 分支名是滚动标签，版本号是这次提交的固定标签
            TAGS="$(printf '%s\n%s' "$SLUG" "$VERSION")"
          fi

          # latest 只跟随默认分支和正式 tag，特性分支的手动构建不会覆盖它
          if [ "$REF_TYPE" = "tag" ] || [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            TAGS="$(printf '%s\nlatest' "$TAGS")"
          fi

          echo "Image:   ${IMAGE}"
          echo "Version: ${VERSION}"
          echo "Tags:"
          printf '  %s\n' $TAGS

          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "tags<<__TAGS__"
            printf '%s\n' "$TAGS"
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Write VERSION
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          echo "${VERSION}" > VERSION
          echo "Building ${VERSION} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}

      # 只按 digest 推送，不打任何标签：单架构镜像是中间产物，标签由 manifest
      # 作业统一打在多架构索引上，避免在 GHCR 里留下 main-amd64 这类没人会用、
      # 又容易被误拉的单架构标签。
      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # 每个架构用独立的缓存 scope：两个架构的层本就不同，共用 scope 会让它们
          # 并发写同一份缓存并驱逐对方正在写的 blob（表现为 error writing layer
          # blob: not_found）。ignore-error 保证缓存导出失败不会让已经推送成功的
          # 镜像构建变成失败。
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }},ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
          echo "${{ matrix.arch }}: ${digest}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  create_manifests:
    name: Create multi-arch manifests
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # 一次 imagetools create 就把索引推成全部标签，三个标签共用同一个索引 digest，
      # 因此只需对该 digest 签名一次。
      - name: Create, push and sign manifests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail

          cd "${RUNNER_TEMP}/digests"

          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "::error::No per-architecture digests were downloaded"
            exit 1
          fi

          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args+=(-t "${IMAGE}:${tag}")
          done <<< "$TAGS"

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

          first_tag="$(printf '%s' "$TAGS" | head -n 1)"
          index_digest="$(docker buildx imagetools inspect "${IMAGE}:${first_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
          cosign sign --yes "${IMAGE}@${index_digest}"

          {
            echo "### Multi-arch manifests"
            echo ''
            echo '```'
            echo "index: ${index_digest}"
            printf '%s\n' "${sources[@]}"
            echo ''
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              echo "${IMAGE}:${tag}"
            done <<< "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
